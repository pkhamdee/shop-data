apiVersion: v1
kind: Secret
metadata:
  name: npmrc
  namespace: dev-live
type: service.binding/npmrc
stringData:
  type: npmrc
  provider: npmrc
  .npmrc: |
    registry=https://registry.npmjs.com
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: shop-data-config
  namespace: dev-live
data:
  app.name: shop-data
  app.service.name: backend
  otel.collector.url: http://localhost:4318/v1/traces
  otel.enable: "false"
